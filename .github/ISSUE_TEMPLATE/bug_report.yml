name: 🐞 Bug report
description: Something broke, looks wrong, or a bind/swap didn't do what you expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        Quick note on things that LOOK like bugs but aren't:
        - The mod works in your survival inventory screen, including screens from other mods that extend it (e.g. Skyblocker's inventory), and in the creative inventory if "Enable in creative inventory" is on in the config. Chests, NPC shops, and other GUIs are deliberately ignored; that's by design.
        - Completing a bind anywhere that isn't a valid partner slot clears that slot's binding; that's the intended way to unbind. Releasing the mouse back over the slot you started from ends nothing — the bind stays open until you finish over a valid partner or anywhere else. You can start a bind from either an inventory slot or a hotbar slot; pairs can be inventory-to-hotbar or hotbar-to-hotbar (or inventory-to-inventory, if you turned that option on). The outlines show where you're allowed to finish.
        - Armor, offhand, and crafting slots can't be bound.
        - The hotbar shift-swap option ships OFF; turn it on in the config before reporting that shift-clicking your hotbar doesn't swap.
        - With inventory-to-inventory binds on, swapping such a pair takes two clicks: middle-click one slot, then its partner (middle-clicking the same slot again cancels). Middle-clicking anything else in between just performs the normal click.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        What did you see, and what did you expect instead?
        Screenshots or a short video clip are super helpful; just drag & drop them right into this box.
      placeholder: |
        I bound a slot to hotbar 3, the icon shows, but shift-clicking it moves the item to the top of my inventory instead of swapping.
        I expected it to swap with the hotbar slot.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does this happen?
      options:
        - Singleplayer
        - On a server (multiplayer), please say which kind (Hypixel, vanilla, other)
        - Both
    validations:
      required: true

  - type: dropdown
    id: screen
    attributes:
      label: Which screen does it happen in?
      description: The mod is only active in the survival inventory (including modded replacement screens), and in the creative inventory only if the 'Enable in creative inventory' config option is on.
      options:
        - My survival inventory (E)
        - Creative inventory
        - A chest / container GUI
        - Some other GUI (shop, menu, ...)
    validations:
      required: true

  - type: dropdown
    id: vanilla
    attributes:
      label: Does the same thing happen without the mod?
      description: If you can, test with the mod removed; it saves me a lot of time.
      options:
        - "No, only with the mod"
        - "Yes, vanilla does it too"
        - Didn't check
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Please provide all of these. The mod version is in the .jar filename in your `mods` folder. Fabric API, YACL, and Mod Menu are required dependencies; the mod won't load without them.
      placeholder: |
        SlotPlus: 1.1.0
        Minecraft: 26.2
        Fabric Loader: 0.19.5
        Fabric API: 0.160.0+26.2
        YACL: 3.9.6+26.2-fabric
        Mod Menu: 20.0.2
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Installed Mod(s) & Version(s)?
      description: |
        List them if you can. Inventory, HUD, and tooltip mods are especially interesting.
      placeholder: |
        sodium-fabric-0.9.2+mc26.2.jar
        lithium-fabric-0.25.3+mc26.2.jar

  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: |
        Upload your log file to https://mclo.gs/ and paste the link here.
        This is extra useful if something crashed, the mod didn't load, or the config screen is broken.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Exact steps are gold: "hold B, click slot 12, click hotbar 3, release B" is much better than "it happens sometimes".
        Also tell me if it happens every time or just occasionally.
        A screenshot or short clip helps a LOT more than words alone. Just please, not 144p 🙏😭 (upload it somewhere and link it here)
      placeholder: |
        1. Open inventory, press B, click slot 12.
        2. Click hotbar slot 3.
        3. Icon appears on slot 12, but the line doesn't draw on hover (happens every time).
    validations:
      required: true
